<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C4E6FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Wczoraj, dziś, jutro">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Wczoraj, dziś, jutro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Pixelify+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: one column of blocky pixel panels floating in a daylight sky above a strip of grass-and-dirt ground; a three-block timeline (amethyst | grass | gold) anchors every task. Pixel face only for short labels; every sentence stays in a reading face. */
:root{
  color-scheme:light;
  --sky:#C4E6FF; --sky-2:#EAF6FF;
  --panel:#FBF6EA; --plank:#F2E3BE; --stone:#DCD8CF; --stone-dark:#A9A397; --white:#FFFFFF;
  --outline:#2E2A24; --ink:#25211B; --ink-soft:#5C5446;
  --grass:#4E922A; --grass-deep:#2F6E14;
  --past:#8458C8; --past-ink:#5E35A1; --past-soft:#EEE5FA;
  --now:#4E922A; --now-ink:#2F6E14; --now-soft:#E2F3D6;
  --future:#E9A620; --future-ink:#8A5900; --future-soft:#FCEFCB;
  --diamond:#3FC8D6; --diamond-ink:#12707D; --diamond-soft:#D7F4F7;
  --good:#2F6E14; --good-soft:#DDF2CF; --bad:#B0302A; --bad-soft:#F8DAD5; --hl:#FFF0A8; --hl-ink:#433400;
  --bevel:inset 3px 3px 0 rgba(255,255,255,.65),inset -3px -3px 0 rgba(0,0,0,.14);
  --drop:0 4px 0 var(--outline);
  --f-pixel:"Pixelify Sans","Andika",ui-monospace,monospace;
  --f-body:"Andika",Verdana,"Segoe UI",system-ui,sans-serif;
  --cloud:linear-gradient(transparent,transparent);
  --ground:linear-gradient(var(--grass) 0 30%,#8A5A35 30%);
}
*{box-sizing:border-box}
html{background-color:var(--sky)}
body{
  min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;
  background-color:var(--sky);
  background-image:var(--cloud),var(--cloud),linear-gradient(180deg,var(--sky-2) 0,var(--sky) 380px);
  background-repeat:no-repeat;
  background-position:6% 10px,94% 58px,0 0;
  background-size:120px 38px,84px 27px,100% 100%;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.app{flex:1 0 auto;width:100%;max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 32px}
.ground{flex:none;height:48px;background-color:#8A5A35;background-image:var(--ground);background-repeat:repeat-x;background-size:48px 48px;border-top:3px solid var(--outline);image-rendering:pixelated}
.scr{display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px dashed var(--outline);outline-offset:3px}
p{margin:0}
.pix{display:inline-block;flex:none;line-height:0}
.pix svg{width:100%;height:100%;display:block}
.card{background:var(--panel);border:3px solid var(--outline);box-shadow:var(--bevel),0 4px 0 rgba(46,42,36,.28);padding:18px}
.muted{color:var(--ink-soft)}
.small{font-size:.92rem}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
.wm{font-family:var(--f-pixel);font-weight:700;font-size:1.15rem;display:flex;gap:.35em;align-items:center;flex-wrap:wrap}
.wm .pix{width:24px;height:24px;margin-right:4px}
.wm .sep{color:var(--ink-soft);font-weight:500}
.c-past{color:var(--past-ink)}.c-now{color:var(--now-ink)}.c-future{color:var(--future-ink)}
.ghost-btn{font-family:var(--f-pixel);font-weight:600;background:var(--stone);border:3px solid var(--outline);box-shadow:var(--bevel),0 3px 0 var(--outline);padding:6px 12px;font-size:.98rem;color:var(--ink)}
.ghost-btn:active{transform:translateY(2px);box-shadow:var(--bevel),0 1px 0 var(--outline)}
.hello-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hello{font-family:var(--f-pixel);font-weight:700;font-size:clamp(1.9rem,7.5vw,2.4rem);line-height:1.05;margin:4px 0 0;text-wrap:balance;text-shadow:3px 3px 0 var(--white)}
.gems{display:inline-flex;align-items:center;gap:8px;background:var(--diamond-soft);border:3px solid var(--outline);box-shadow:var(--bevel);padding:4px 10px 4px 8px;font-family:var(--f-pixel);font-weight:700;font-size:1.2rem;color:var(--diamond-ink);font-variant-numeric:tabular-nums}
.gems .pix{width:24px;height:21px}
.label{font-family:var(--f-pixel);font-weight:600;font-size:.95rem;color:var(--ink-soft);letter-spacing:.02em}

/* buttons */
.btn{font-family:var(--f-pixel);font-weight:700;border:3px solid var(--outline);border-radius:0;padding:12px 18px;font-size:1.15rem;box-shadow:var(--bevel),var(--drop);transition:transform .06s}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:var(--bevel),0 1px 0 var(--outline)}
.btn.primary{background:var(--grass);color:var(--white);text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.btn.big{width:100%;padding:15px;font-size:1.35rem}
.btn.secondary{background:var(--stone);color:var(--ink);width:100%}
.btn.danger{background:var(--bad);color:var(--white);text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:var(--bevel)}

/* home */
.today{display:flex;flex-direction:column;gap:14px}
.today-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.today-big{font-size:1.3rem;font-weight:700;margin-top:2px}
.streak{display:flex;flex-direction:column;align-items:center;min-width:70px;padding:6px 10px;background:var(--future);border:3px solid var(--outline);box-shadow:var(--bevel);color:var(--ink);line-height:1.1;text-align:center}
.streak b{font-family:var(--f-pixel);font-size:1.6rem}
.streak span{font-size:.75rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:3px 10px;background:var(--white);border:2px solid var(--outline);font-size:.88rem;font-weight:700}
.sheet-link{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--hl);color:var(--hl-ink);border:3px solid var(--outline);box-shadow:var(--bevel),0 3px 0 var(--outline);padding:12px 16px}
.sheet-link:active{transform:translateY(2px);box-shadow:var(--bevel),0 1px 0 var(--outline)}
.sheet-link b{font-family:var(--f-pixel);font-weight:700;font-size:1.15rem;display:block}
.sheet-link span{font-size:.92rem}
.sheet-link .arr{margin-left:auto;font-family:var(--f-pixel);font-size:1.6rem;line-height:1}
.sec-h{font-family:var(--f-pixel);font-weight:700;font-size:1.2rem;margin:8px 0 0;text-shadow:2px 2px 0 var(--white)}
.path{display:flex;flex-direction:column;gap:10px}
.t-past{--tc:var(--past);--tcs:var(--past-soft);--tci:var(--past-ink);--tt:var(--white)}
.t-now,.t-usual{--tc:var(--now);--tcs:var(--now-soft);--tci:var(--now-ink);--tt:var(--white)}
.t-future{--tc:var(--future);--tcs:var(--future-soft);--tci:var(--future-ink);--tt:var(--ink)}
.t-mix{--tc:var(--diamond);--tcs:var(--diamond-soft);--tci:var(--diamond-ink);--tt:var(--ink)}
.lv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:3px solid var(--outline);box-shadow:var(--bevel),0 3px 0 rgba(46,42,36,.35);padding:12px 14px}
.lv:active{transform:translateY(2px)}
.lv.locked{background:rgba(255,255,255,.5);border-style:dashed;box-shadow:none;color:var(--ink-soft)}
.lv-num{width:42px;height:42px;display:grid;place-items:center;font-family:var(--f-pixel);font-weight:700;font-size:1.25rem;color:var(--tt);background:var(--tc);border:3px solid var(--outline);box-shadow:var(--bevel)}
.t-past .lv-num,.lv-num.t-past,.lv-num.t-now,.lv-num.t-usual{text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.locked .lv-num{background:var(--stone);color:var(--ink-soft);text-shadow:none}
.lv-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.lv-title{font-weight:700;font-size:1.08rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv-sub{font-size:.9rem;color:var(--ink-soft)}
.lv-bar{display:flex;align-items:center;gap:10px;margin-top:6px}
.bar{position:relative;flex:1;height:14px;background:rgba(46,42,36,.14);border:2px solid var(--outline);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tc,var(--grass));box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(46,42,36,.45) calc(10% - 2px) 10%)}
.lv-meta{font-size:.82rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv-go{font-family:var(--f-pixel);font-size:1.6rem;color:var(--ink-soft);line-height:1}
.lv-lock{font-size:.85rem;margin-top:4px}
.tag-new{font-family:var(--f-pixel);font-weight:700;font-size:.8rem;background:var(--hl);color:var(--hl-ink);border:2px solid var(--outline);padding:0 6px}

/* lesson */
.lbar{display:flex;align-items:center;gap:12px}
.icon-btn{width:44px;height:44px;flex:none;border:3px solid var(--outline);background:var(--stone);box-shadow:var(--bevel),0 3px 0 var(--outline);font-family:var(--f-pixel);font-weight:700;font-size:1.5rem;line-height:1;display:grid;place-items:center;color:var(--ink)}
.prog{position:relative;flex:1;height:20px;background:rgba(46,42,36,.18);border:3px solid var(--outline);overflow:hidden}
.prog i{display:block;height:100%;background:var(--grass);box-shadow:inset 0 4px 0 rgba(255,255,255,.35);transition:width .3s}
.prog::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 3px),rgba(46,42,36,.5) calc(10% - 3px) 10%)}
.count{font-family:var(--f-pixel);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);font-size:1rem;min-width:3em;text-align:right}
.lesson-card{display:flex;flex-direction:column;gap:14px}
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-bottom:8px}
.zone{height:42px;background:var(--stone);border:3px solid var(--outline);box-shadow:var(--bevel);display:grid;place-items:center;font-family:var(--f-pixel);font-weight:700;font-size:1rem;color:var(--ink-soft);position:relative}
.zone.on{background:var(--tc);color:var(--tt)}
.zone.on.t-past,.zone.on.t-now,.zone.on.t-usual{text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.zone.on::after{content:"";position:absolute;bottom:-11px;left:50%;width:10px;height:6px;margin-left:-5px;background:var(--outline)}
.zone.z-usual.on{background-image:repeating-conic-gradient(rgba(255,255,255,.2) 0 25%,transparent 0 50%);background-size:12px 12px}
.instr{font-weight:700;color:var(--ink-soft);font-size:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cue{background:var(--hl);color:var(--hl-ink);border:2px solid var(--outline);padding:0 8px;font-size:.88rem}
.sent{font-size:clamp(1.55rem,6.4vw,2.05rem);line-height:1.35;overflow-wrap:anywhere}
.sent.pl{font-size:clamp(1.35rem,5.6vw,1.75rem)}
.sent.bad{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px;color:var(--ink-soft)}
.sent.ok{color:var(--good)}
.slot{display:inline-block;min-width:3.4em;border-bottom:4px dashed var(--diamond-ink);margin:0 .15em;text-align:center;line-height:1.15}
.slot.in{border-bottom-style:solid;color:var(--diamond-ink);font-weight:700;animation:drop .3s steps(3,end)}
@keyframes drop{from{transform:translateY(-8px);opacity:.3}to{transform:none;opacity:1}}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--outline);background:var(--white);box-shadow:0 2px 0 var(--outline);padding:5px 12px;font-size:.92rem;font-weight:700;color:var(--ink)}
.chip-btn:active{transform:translateY(2px);box-shadow:none}
.ico{display:inline-grid;place-items:center;width:18px;height:18px;flex:none}
.ico svg{width:100%;height:100%}
.pl-line{color:var(--ink-soft);font-style:italic;font-size:1.08rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px}
.opt{min-height:60px;padding:12px 14px;background:var(--plank);border:3px solid var(--outline);box-shadow:var(--bevel),var(--drop);font-size:1.32rem;font-weight:700;color:var(--ink);transition:transform .06s}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:var(--bevel),0 1px 0 var(--outline)}
.opt.wrong{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;box-shadow:var(--bevel);transform:translateY(3px);animation:nope .3s steps(4,end)}
.opt.right{background:var(--good-soft);color:var(--good);box-shadow:var(--bevel);transform:translateY(3px)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.5}
@keyframes nope{0%,100%{translate:0}25%{translate:-5px}50%{translate:5px}75%{translate:-3px}}
.time-opts{grid-template-columns:1fr}
.time-opts .opt{display:flex;align-items:center;gap:12px;font-size:1.15rem;text-align:left;min-height:54px}
.time-opts .dot{width:22px;height:22px;background:var(--tc);border:3px solid var(--outline);box-shadow:inset 2px 2px 0 rgba(255,255,255,.5);flex:none}
.build-line{min-height:66px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:rgba(255,255,255,.6);border:3px dashed var(--stone-dark)}
.build-line.done{border-style:solid;border-color:var(--good)}
.build-ph{color:var(--ink-soft);font-size:.98rem}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.tile{background:var(--plank);border:3px solid var(--outline);box-shadow:var(--bevel),0 3px 0 var(--outline);padding:8px 13px;font-size:1.22rem;font-weight:700;color:var(--ink)}
.tile:active:not([disabled]){transform:translateY(2px);box-shadow:var(--bevel),0 1px 0 var(--outline)}
.tile.used{visibility:hidden}
.tile.placed{background:var(--diamond-soft);color:var(--diamond-ink);box-shadow:var(--bevel)}
.tile.fixed{background:var(--good-soft);color:var(--good);box-shadow:var(--bevel);cursor:default}
.fb{border:3px solid var(--outline);box-shadow:var(--bevel);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-soft)}.fb.good .fb-title{color:var(--good)}
.fb.miss{background:var(--bad-soft)}.fb.miss .fb-title{color:var(--bad)}
.fb.hint{background:var(--hl);color:var(--hl-ink)}
.fb-title{font-family:var(--f-pixel);font-weight:700;font-size:1.3rem}
.fb-sent{font-size:1.28rem;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.fb-sent button{border:2px solid var(--outline);background:var(--white);color:var(--ink);padding:4px;display:inline-grid;place-items:center}
.fb-note{font-size:.92rem;color:var(--ink-soft)}
.gem-gain{display:flex;align-items:center;gap:8px;font-family:var(--f-pixel);font-weight:700;color:var(--diamond-ink);font-size:1.05rem}
.gem-gain .pix{width:24px;height:21px;animation:drop .3s steps(3,end)}

/* intro */
.intro{display:flex;flex-direction:column;gap:14px}
.intro-title{font-family:var(--f-pixel);font-weight:700;font-size:clamp(1.7rem,6.8vw,2.2rem);margin:0;line-height:1.1;text-wrap:balance}
.intro-lead{font-size:1.08rem}
.rules{display:flex;flex-direction:column;gap:8px}
.rule-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:2px 10px;align-items:center;padding:10px 12px;background:var(--white);border:2px solid var(--outline)}
.r-who{font-weight:700;font-size:1.08rem}
.r-arrow{font-family:var(--f-pixel);color:var(--ink-soft)}
.r-form{font-weight:700;font-size:1.22rem;color:var(--diamond-ink)}
.r-pl{grid-column:1/-1;font-size:.88rem;color:var(--ink-soft)}
.trap{background:var(--hl);color:var(--hl-ink);border:2px solid var(--outline);padding:10px 12px}
.examples{display:flex;flex-direction:column;gap:4px}
.ex{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;font-size:1.18rem;padding:6px 0;color:var(--ink)}
.ex .ico{color:var(--diamond-ink)}

/* summary */
.sum-card{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.sum-title{font-family:var(--f-pixel);font-weight:700;font-size:clamp(2rem,8.5vw,2.6rem);line-height:1.1}
.loot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.loot .pix{width:32px;height:28px;animation:drop .3s steps(3,end) backwards}
.loot .miss{width:28px;height:28px;background:var(--stone);border:3px solid var(--outline);box-shadow:var(--bevel);animation:drop .3s steps(3,end) backwards}
.sum-lines{display:flex;flex-direction:column;gap:6px;font-size:1.08rem}

/* sheet */
.sheet-sec{display:flex;flex-direction:column;gap:8px}
.sheet-sec h2{font-family:var(--f-pixel);font-weight:700;font-size:1.25rem;margin:4px 0 0;display:flex;align-items:center;gap:10px;text-shadow:2px 2px 0 var(--white)}
.sheet-sec h2::before{content:"";width:18px;height:18px;background:var(--tc);border:3px solid var(--outline);box-shadow:inset 2px 2px 0 rgba(255,255,255,.5)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:center;padding:9px 12px;background:var(--panel);border:2px solid var(--outline)}
.srow .pl{color:var(--ink-soft)}
.say{display:flex;gap:8px;align-items:center;border:0;background:transparent;padding:0;text-align:left;font-weight:700;font-size:1.12rem;color:var(--ink)}
.say .ico{color:var(--tci,var(--diamond-ink))}
.trow{display:grid;gap:4px;padding:10px 12px;background:var(--panel);border:2px solid var(--outline)}
.trow .no{text-decoration:line-through;text-decoration-color:var(--bad);color:var(--ink-soft)}
.trow .yes{color:var(--good)}

/* parent */
.pcard{display:flex;flex-direction:column;gap:14px}
.pcard h2{font-family:var(--f-pixel);font-weight:700;font-size:1.25rem;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.95rem}
.field input,.field select{font:inherit;font-size:1rem;padding:10px 12px;border-radius:0;border:3px solid var(--outline);background:var(--white);color:var(--ink);width:100%}
.note{font-size:.88rem;color:var(--ink-soft)}
.code{font:.78rem/1.35 ui-monospace,Menlo,Consolas,monospace;width:100%;padding:8px 10px;border:3px solid var(--outline);border-radius:0;background:var(--white);color:var(--ink);resize:vertical;overflow-wrap:anywhere}
.field input[type=file]{padding:8px;font-size:.92rem}
.bk-msg{font-weight:700;color:var(--good)}
.pin-form{display:flex;flex-direction:column;gap:12px}
.pin-form h2{font-family:var(--f-pixel);font-weight:700;font-size:1.25rem;margin:0}
.field .pin-in{font-family:var(--f-pixel);font-size:1.6rem;letter-spacing:.35em;text-align:center;padding:10px}
.bk-msg.err{color:var(--bad)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:1rem}
.check input{width:22px;height:22px;accent-color:var(--grass);flex:none;margin:1px 0 0}
.check small{display:block;color:var(--ink-soft);font-size:.88rem}
.srows{display:flex;flex-direction:column}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:2px dashed var(--stone-dark);align-items:center}
.stat:last-child{border-bottom:0}
.stat .bar{grid-column:1/-1}
.stat .v{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.92rem;font-weight:700;text-align:right}
.stat .k{font-weight:700;min-width:0}

function lvStats(l){const cs=CARDS.filter(c=>c.l===l);let m=0,seen=0,pts=0,n=0,c=0;
  for(const x of cs){const r=st.cards[x.id];if(r){seen++;if(r.b>=3)m++;pts+=(r.b-1)/4;n+=r.n||0;c+=r.c||0;}}
  return {total:cs.length,mastered:m,seen,prog:pts/cs.length,acc:n?c/n:null};}
function isUnlocked(l){if(l===1||st.unlockAll)return true;
  if(CARDS.some(c=>c.l===l&&st.cards[c.id]))return true;
  const p=lvStats(l-1);return p.mastered/p.total>=0.6;}
function newItem(c,mode){return {c,mode,tries:0,state:'ask',wrong:[],opts:c.o?shuffle(c.o.slice()):null,placed:[],tiles:null,showPl:false};}
const ONE_PER={match:1,judge:1};/* at most this many of these task types when a mission is put together (a retry after a mistake does not count) */
function buildSession(only){
  const N=st.size||10,now=Date.now();
  const pool=CARDS.filter(c=>only?c.l===only:isUnlocked(c.l));
  const due=[],fr=[],rest=[];
  for(const c of pool){const r=st.cards[c.id];if(!r)fr.push(c);else if(r.due<=now)due.push(c);else rest.push(c);}
  due.sort((a,b)=>st.cards[a.id].b-st.cards[b.id].b||st.cards[a.id].due-st.cards[b.id].due);
  const used={};
  const take=(list,k,mode,out)=>{let got=0;for(const c of list){if(got>=k)break;const cap=ONE_PER[c.t];if(cap!=null){if((used[c.t]||0)>=cap)continue;used[c.t]=(used[c.t]||0)+1;}out.push({c,mode});got++;}return out;};
  const frOk=fr.filter(c=>ONE_PER[c.t]==null).length+Object.keys(ONE_PER).reduce((a,t)=>a+Math.min(ONE_PER[t],fr.filter(c=>c.t===t).length),0);
  const maxNew=Math.max(3,Math.min(7,N-due.length));
  const newTake=Math.min(maxNew,frOk);
  const dueTake=Math.min(due.length,N-newTake);
  let pick=take(due,dueTake,'due',[]);
  take(fr,N-pick.length>newTake?newTake:N-pick.length,'new',pick);
  if(pick.length<N){shuffle(rest).sort((a,b)=>st.cards[a.id].b-st.cards[b.id].b);take(rest,N-pick.length,'practice',pick);}
  const stage={who:0,when:0,match:1,spell:1,pick:1,letters:2,judge:2,build:3};
  pick=shuffle(pick).sort((x,y)=>stage[x.c.t]-stage[y.c.t]);
  return pick.map(p=>newItem(p.c,p.mode));
}
const pairsText=(c,sep)=>c.p.map(p=>fill(p[0])+' '+fill(p[1])).join(sep);
function sayText(c){return c.t==='match'?pairsText(c,', ')+'.':fullSentence(c);}
function fullSentence(c){
  if(c.t==='match')return pairsText(c,' · ');
  if(c.t==='who'||c.t==='pick'||c.t==='spell')return fill(c.s).replace('_',fill(c.a));
  if(c.t==='letters')return fill(c.s).replace('_',c.a.join(''));
  if(c.t==='judge')return c.a?fill(c.s):fill(c.fix);
  if(c.t==='build'){const s=c.a.map(fill).join(' ').replace(' ?','?');return /[?!.]$/.test(s)?s:s+'.';}
  return fill(c.s);
}
function sayNow(c,it){
  if(c.t==='match')return '';
  if(it.state==='done'||c.t==='spell'||c.t==='letters')return fullSentence(c);
  if(c.t==='who'||c.t==='pick')return fill(c.s).replace('_',' … ');
  if(c.t==='build')return '';
  return fill(c.s);
}

  catch(e){const code=e&&e.code;if(code&&code!=='unavailable'&&code!=='resource_exhausted'){store.mode='local';if(cur==='parent')renderParent();}}

/* ---------- the hero walks along the big grass strip at the bottom during a mission ---------- */
function walkScale(){return innerWidth>=700?4:3;}
function updateWalker(){
  const g=document.querySelector('.ground');if(!g)return;
  let w=document.getElementById('walk');const on=cur==='lesson'&&!!S&&!!S.items&&S.items.length>0;
  document.body.classList.toggle('walking',on);
  if(!on){if(w)w.hidden=true;return;}
  if(!w){w=h('div',{id:'walk',class:'walk','aria-hidden':'true'});g.append(w);}
  w.hidden=false;
  const N=S.items.length,it=S.items[S.i],done=!!it&&it.state==='done',p=Math.min(1,(S.i+(done?1:0))/N);
  const sc=walkScale(),hero=heroEl(sc,'walk-hero'),hw=hero.style.width,cw=12*sc;
  const at=q=>'calc((100% - '+hw+' - '+(cw+10)+'px) * '+q.toFixed(4)+')';
  const from=S.trailP==null?p:S.trailP;hero.style.left=at(from);
  if(done&&it.correct&&!it.hop){it.hop=true;hero.classList.add('hop');}
  else if(it&&(it.state==='hint'||(done&&!it.correct))&&!it.oops){it.oops=true;hero.classList.add('oops');}
  const chest=pix(CHEST,CHEST_P,'walk-chest'+(p>=1?' open':''));chest.style.width=cw+'px';chest.style.height=(8*sc)+'px';
  const fl=h('i',{class:'walk-done'});fl.style.width=(from*100).toFixed(2)+'%';
  w.replaceChildren(fl,chest,hero);
  if(from!==p)requestAnimationFrame(()=>requestAnimationFrame(()=>{hero.style.left=at(p);fl.style.width=(p*100).toFixed(2)+'%';}));
  S.trailP=p;
}

let bk={msg:'',err:false,pending:null,code:false};
const BK_APP='wczoraj-dzis-jutro';
function backupText(){return JSON.stringify({app:BK_APP,v:1,saved:Date.now(),state:st});}
function readBackup(text){try{const o=JSON.parse(String(text||'').trim());if(!o||o.app!==BK_APP||!o.state||typeof o.state!=='object')return null;return o;}catch(e){return null;}}
function bkSet(msg,err){bk.msg=msg;bk.err=!!err;renderParent();}
async function saveBackup(){
  const fn=BK_APP+'-kopia-'+dayKey()+'.json';let dl=null;
  try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){}
  if(!dl&&!window.claude){try{const u=URL.createObjectURL(new Blob([backupText()],{type:'application/json'})),a=document.createElement('a');
    a.href=u;a.download=fn;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);bkSet('Kopia zapisana jako plik '+fn+'. Sprawdź folder Pobrane.');return;}catch(e){}}
  if(!dl){bk.code=true;bkSet('Zapis pliku nie działa w tym widoku. Skopiuj kod kopii poniżej i zachowaj go, np. w notatkach albo w mailu do siebie.',true);return;}
  try{await dl.save({filename:fn,data:backupText()});bkSet('Kopia zapisana jako plik '+fn+'.');}
  catch(e){const c=e&&e.code;
    if(c==='declined')bkSet('Zapis anulowany.');
    else if(c==='rate_limited')bkSet('Okno zapisu jest już otwarte. Spróbuj za chwilę.',true);
    else{bk.code=true;bkSet('Nie udało się zapisać pliku. Skopiuj kod kopii poniżej.',true);}}
}
function stageImport(text){const o=readBackup(text);if(!o){bkSet('To nie jest kopia z tej aplikacji albo kod jest niepełny.',true);return;}bk.pending=o;bk.msg='';renderParent();}
function applyImport(){const o=bk.pending;if(!o)return;st=merge(JSON.parse(JSON.stringify(o.state)));st.updated=Date.now();save();clearTimeout(saveTimer);flush();pickVoice();
  bk={msg:'Kopia wczytana. Postęp z '+new Date(o.saved).toLocaleString('pl-PL')+' jest przywrócony.',err:false,pending:null,code:false};renderParent();}

function weakHash(s){let a=5381,b=52711;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=(a*33)^c;b=(b*31)^c;}return 'w'+(a>>>0).toString(16)+(b>>>0).toString(16);}
async function pinHashOf(pin,salt){const txt=salt+':'+pin;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
  return weakHash(txt);}
function newSalt(){try{const a=new Uint8Array(8);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return String(Math.random()).slice(2);}}
function pinInput(id,label){return h('div',{class:'field'},h('label',{for:id},label),
  h('input',{id,class:'pin-in',type:'password',inputmode:'numeric',pattern:'[0-9]*',maxlength:'6',autocomplete:'off',required:true}));}

  if(a!==b){pinMsg='Oba PIN-y muszą być takie same.';pinErr=true;renderParent();return false;}
  const salt=newSalt();st.pin={salt,hash:await pinHashOf(a,salt)};save();parentOK=true;pinMsg='PIN ustawiony. Od teraz panel otwiera się dopiero po jego wpisaniu.';pinErr=false;renderParent();return true;}

/* ---------- version card in the parent panel ---------- */
let VCHK=null;
const fmtD=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString('pl-PL');}catch(e){return d;}};
const canCheckVer=()=>!window.claude&&/^[0-9a-f]{12}$/.test(BUILD)&&/^https?:$/.test(location.protocol);
function verPlace(){if(window.claude)return 'na claude.ai';
  try{if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)return 'z ikony na ekranie początkowym';}catch(e){}
  return 'w przeglądarce';}
function checkVer(){
  if(!navigator.onLine){VCHK={t:Date.now(),st:'off'};paintVer();return;}
  VCHK={t:Date.now(),st:'busy'};paintVer();
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('http');return r.json();})
    .then(j=>{VCHK={t:Date.now(),st:j&&j.build&&j.build!==BUILD?'new':'ok',srv:j||{}};paintVer();})
    .catch(()=>{VCHK={t:Date.now(),st:navigator.onLine?'err':'off'};paintVer();});}
function updateNow(){
  if(UPD){applyUpdate();return;}
  VCHK={t:Date.now(),st:'upd',srv:VCHK&&VCHK.srv};paintVer();
  if(!SWREG){location.reload();return;}
  SWREG.update().catch(()=>{}).then(()=>{let n=0;const iv=setInterval(()=>{n++;
    if(UPD){clearInterval(iv);applyUpdate();}else if(n>60){clearInterval(iv);location.reload();}},250);});}
function verStatus(){
  const again=()=>h('button',{class:'btn secondary',type:'button',onclick:checkVer},'Sprawdź ponownie');
  const v=VCHK||{st:'busy'},s=v.srv||{},nv=(s.ver?' '+s.ver:'')+(s.date?' z '+fmtD(s.date):'');
  if(UPD)return ['new',[h('p',null,'Nowa wersja'+nv+' jest już pobrana.'),h('button',{class:'btn primary',type:'button',onclick:applyUpdate},'Odśwież teraz')]];
  if(v.st==='busy')return ['',[h('p',null,'Sprawdzam, czy jest nowsza wersja…')]];
  if(v.st==='upd')return ['new',[h('p',null,'Pobieram nową wersję…')]];
  if(v.st==='ok')return ['ok',[h('p',null,'✓ To jest najnowsza wersja.'),again()]];
  if(v.st==='new')return ['new',[h('p',null,'Jest nowsza wersja'+nv+'.'),s.notes?h('p',{class:'note'},'Co nowego: '+s.notes):null,
    h('button',{class:'btn primary',type:'button',onclick:updateNow},'Zaktualizuj teraz')]];
  if(v.st==='off')return ['',[h('p',null,'Brak internetu, więc nie da się teraz sprawdzić aktualizacji. Aplikacja działa dalej.'),again()]];
  return ['',[h('p',null,'Nie udało się sprawdzić aktualizacji.'),again()]];}
function paintVer(){const el=document.getElementById('verSt');if(!el)return;const [cls,kids]=verStatus();el.className='ver-st'+(cls?' '+cls:'');el.replaceChildren(...kids.filter(Boolean));}
function verCard(){
  const live=canCheckVer();
  const item=(c,i)=>h('li',null,h('b',null,'1.'+(CHANGES.length-1-i)),h('span',null,c[1],h('small',null,fmtD(c[0]))));
  const card=h('div',{class:'card pcard'},h('h2',null,'Wersja aplikacji'),
    h('div',{class:'ver-top'},h('span',{class:'ver-num'},'Wersja '+APP_VER),h('span',{class:'muted'},'z '+fmtD(APP_DATE))),
    h('p',{class:'note'},'Uruchomiona '+verPlace()+'.'+(live?' Kod wersji: '+BUILD+'.':'')),
    window.claude?h('p',{class:'note'},'Na claude.ai zawsze otwiera się najnowsza wersja.'):null,
    live?h('div',{id:'verSt',class:'ver-st'}):null,
    h('p',{class:'label'},'Co nowego'),
    h('ul',{class:'chg'},CHANGES.slice(0,4).map((c,i)=>item(c,i))),
    CHANGES.length>4?h('details',{class:'chg-more'},h('summary',null,'Starsze zmiany'),h('ul',{class:'chg'},CHANGES.slice(4).map((c,i)=>item(c,i+4)))):null);
  if(live){setTimeout(()=>{if(!VCHK||(VCHK.st!=='busy'&&VCHK.st!=='upd'&&Date.now()-VCHK.t>60000))checkVer();else paintVer();},0);}
  return card;}

/* ---------- offline + update notice (only on the GitHub Pages copy) ---------- */
let UPD=null,swReload=false,SWREG=null;
function showUpd(){paintVer();let el=document.getElementById('updBar');
  if(!UPD||cur==='lesson'||OV){if(el)el.hidden=true;return;}
  if(!el){el=h('div',{id:'updBar',class:'upd',role:'status'},h('button',{class:'btn primary',type:'button',onclick:applyUpdate},'Nowa wersja – dotknij, aby odświeżyć'));document.body.append(el);}
  el.hidden=false;}
function applyUpdate(){swReload=true;try{if(UPD)UPD.postMessage('skip');else location.reload();}catch(e){location.reload();}setTimeout(()=>location.reload(),4000);}
(function(){
  if(window.claude||!('serviceWorker' in navigator))return;
  if(location.protocol!=='https:'&&location.hostname!=='localhost')return;
  let reg=null;const ready=w=>{UPD=w;showUpd();};
  navigator.serviceWorker.register('sw.js').then(r=>{reg=r;SWREG=r;
    if(r.waiting&&navigator.serviceWorker.controller)ready(r.waiting);
    r.addEventListener('updatefound',()=>{const nw=r.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)ready(nw);});});
  }).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&reg)reg.update().catch(()=>{});});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swReload){swReload=false;location.reload();}});
})();

go('home');
initStore();
})();
